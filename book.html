<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RentCar — Book</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a class="nav-brand" href="index.html">
        <img src="images/logo.png" alt="RentCar — Super Fast Rentals">
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="fleet.html">Fleet</a></li>
        <li><a href="book.html" class="active">Book</a></li>
        <li><a href="about.html">About</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Book</h1>
    <p>Fill this in and send a request. We'll reply by email.</p>

    <form class="book-form" action="book.html">
      <label>Name
        <input type="text" name="name">
      </label>
      <label>Email
        <input type="email" name="email">
      </label>
      <label>Pick up date
        <input type="date" name="pickup">
      </label>
      <label>Drop off date
        <input type="date" name="dropoff">
      </label>

      <h2>Pick a car</h2>

      <h2>Small cars</h2>
      <div class="pick-row">
        <label class="pick">
          <input type="radio" name="vehicle" value="Toyota Corolla" required>
          <img src="images/cars/corolla.jpg" alt="Toyota Corolla">
          <span>Toyota Corolla<br>$45/day</span>
        </label>
        <label class="pick">
          <input type="radio" name="vehicle" value="Mazda 3">
          <img src="images/cars/mazda3.jpg" alt="Mazda 3">
          <span>Mazda 3<br>$55/day</span>
        </label>
        <label class="pick">
          <input type="radio" name="vehicle" value="Suzuki Swift">
          <img src="images/cars/swift.jpg" alt="Suzuki Swift">
          <span>Suzuki Swift<br>$45/day</span>
        </label>
      </div>

      <h2>SUVs</h2>
      <div class="pick-row">
        <label class="pick">
          <input type="radio" name="vehicle" value="Toyota RAV4">
          <img src="images/cars/rav4.jpg" alt="Toyota RAV4">
          <span>Toyota RAV4<br>$75/day</span>
        </label>
        <label class="pick">
          <input type="radio" name="vehicle" value="Mazda CX-5">
          <img src="images/cars/cx5.jpg" alt="Mazda CX-5">
          <span>Mazda CX-5<br>$80/day</span>
        </label>
        <label class="pick">
          <input type="radio" name="vehicle" value="Kia Sportage">
          <img src="images/cars/sportage.jpg" alt="Kia Sportage">
          <span>Kia Sportage<br>$75/day</span>
        </label>
      </div>

      <h2>Vans and utes</h2>
      <div class="pick-row">
        <label class="pick">
          <input type="radio" name="vehicle" value="Ford Ranger">
          <img src="images/cars/ranger.jpg" alt="Ford Ranger">
          <span>Ford Ranger<br>$85/day</span>
        </label>
        <label class="pick">
          <input type="radio" name="vehicle" value="Toyota Hilux">
          <img src="images/cars/hilux.jpg" alt="Toyota Hilux">
          <span>Toyota Hilux<br>$90/day</span>
        </label>
        <label class="pick">
          <input type="radio" name="vehicle" value="Toyota HiAce">
          <img src="images/cars/hiace.jpg" alt="Toyota HiAce">
          <span>Toyota HiAce<br>$95/day</span>
        </label>
      </div>

      <h2>Luxury</h2>
      <div class="pick-row">
        <label class="pick">
          <input type="radio" name="lux1" value="BMW M3">
          <img src="images/cars/m3.jpg" alt="BMW M3">
          <span>BMW M3<br>$180/day</span>
        </label>
        <label class="pick">
          <input type="radio" name="lux2" value="Mercedes C-Class">
          <img src="images/cars/cclass.jpg" alt="Mercedes C-Class">
          <span>Mercedes C-Class<br>$140/day</span>
        </label>
        <label class="pick">
          <input type="radio" name="lux3" value="Subaru WRX">
          <img src="images/cars/wrx.jpg" alt="Subaru WRX">
          <span>Subaru WRX<br>$160/day</span>
        </label>
      </div>

      <p>Extras</p>
      <label class="check">
        <input type="checkbox" name="rack"> Roof rack — $10/day
      </label>
      <p>Child seat — $8/day</p>

      <button class="btn btn-primary" type="submit">Send request</button>
    </form>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 RentCar</p>
    <p>
      <a href="#">TikTok</a>
      <a href="#">YouTube</a>
      <a href="#">Instagram</a>
    </p>
  </footer>
</body>
</html>

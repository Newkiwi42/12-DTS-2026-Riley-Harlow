<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RentCar — Book</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a class="nav-brand" href="index.html">
        <img src="images/logo.png" alt="RentCar — Super Fast Rentals">
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="fleet.html">Fleet</a></li>
        <li><a href="book.html" class="active">Book</a></li>
        <li><a href="about.html">About</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Book</h1>
    <p>Fill this in and send a request. We'll reply by email.</p>

    <form class="book-form" action="book.html">
      <label>Name
        <input type="text" name="name">
      </label>
      <label>Email
        <input type="email" name="email">
      </label>
      <label>Pick up date
        <input type="date" name="pickup">
      </label>
      <label>Drop off date
        <input type="text" name="dropoff" placeholder="type a date">
      </label>
      <label>Vehicle
        <select name="vehicle">
          <option>Small car — $45/day</option>
          <option>Van or ute — $85/day</option>
        </select>
      </label>

      <p>Extras</p>
      <label class="check">
        <input type="checkbox" name="rack"> Roof rack — $10/day
      </label>
      <p>Child seat — $8/day</p>

      <button class="btn btn-primary" type="submit">Send request</button>
    </form>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 RentCar</p>
    <p>
      <a href="#">TikTok</a>
      <a href="#">YouTube</a>
      <a href="#">Instagram</a>
    </p>
  </footer>
</body>
</html>
